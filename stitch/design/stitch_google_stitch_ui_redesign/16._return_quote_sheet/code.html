<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Return Quote Sheet</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-highest": "#e2e2e2",
                        "tertiary-fixed": "#e2e2e2",
                        "inverse-primary": "#c6c6c6",
                        "on-tertiary-container": "#848484",
                        "on-tertiary-fixed": "#1b1b1b",
                        "on-primary-fixed": "#1b1b1b",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-surface": "#1b1b1b",
                        "on-primary-container": "#848484",
                        "on-error-container": "#93000a",
                        "secondary-container": "#d0e1fb",
                        "error-container": "#ffdad6",
                        "secondary": "#505f76",
                        "primary": "#000000",
                        "on-surface-variant": "#4c4546",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#e8e8e8",
                        "tertiary-container": "#1b1b1b",
                        "on-secondary-container": "#54647a",
                        "on-tertiary-fixed-variant": "#474747",
                        "on-error": "#ffffff",
                        "primary-fixed": "#e2e2e2",
                        "error": "#ba1a1a",
                        "inverse-on-surface": "#f1f1f1",
                        "outline": "#7e7576",
                        "on-secondary-fixed-variant": "#38485d",
                        "background": "#f9f9f9",
                        "surface-dim": "#dadada",
                        "surface-variant": "#e2e2e2",
                        "on-secondary-fixed": "#0b1c30",
                        "secondary-fixed-dim": "#b7c8e1",
                        "surface": "#f9f9f9",
                        "surface-bright": "#f9f9f9",
                        "tertiary": "#000000",
                        "secondary-fixed": "#d3e4fe",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#c6c6c6",
                        "surface-container-low": "#f3f3f3",
                        "primary-container": "#1b1b1b",
                        "on-primary-fixed-variant": "#474747",
                        "inverse-surface": "#303030",
                        "surface-container": "#eeeeee",
                        "primary-fixed-dim": "#c6c6c6",
                        "outline-variant": "#cfc4c5",
                        "surface-tint": "#5e5e5e",
                        "on-background": "#1b1b1b"
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                    spacing: {
                        unit: "4px",
                        "container-padding": "16px",
                        "stack-gap": "12px",
                        "section-margin": "24px",
                        "inline-gap": "8px"
                    },
                    fontFamily: {
                        "data-tabular": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "subheading": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    fontSize: {
                        "data-tabular": ["13px", { lineHeight: "18px", fontWeight: "500" }],
                        "label-caps": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "700" }],
                        "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "headline-md": ["22px", { lineHeight: "28px", letterSpacing: "-0.01em", fontWeight: "600" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "subheading": ["14px", { lineHeight: "20px", letterSpacing: "0.01em", fontWeight: "600" }],
                        "headline-lg": ["24px", { lineHeight: "32px", letterSpacing: "-0.02em", fontWeight: "700" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background h-screen w-full flex flex-col font-sans overflow-hidden">
<!-- Mock Background Content to show overlay effect -->
<div class="flex-1 p-container-padding flex flex-col gap-stack-gap">
<div class="h-32 bg-surface-container rounded-lg"></div>
<div class="h-64 bg-surface-container rounded-lg"></div>
<div class="h-32 bg-surface-container rounded-lg"></div>
</div>
<!-- Scrim / Dimmed Background -->
<div aria-hidden="true" class="fixed inset-0 bg-primary/40 z-40 transition-opacity duration-300"></div>
<!-- Bottom Sheet -->
<div aria-labelledby="sheet-title" aria-modal="true" class="fixed bottom-0 left-0 w-full bg-surface-container-lowest rounded-t-[24px] z-50 flex flex-col shadow-[0_-4px_24px_rgba(0,0,0,0.1)] transform transition-transform duration-300 translate-y-0" role="dialog">
<!-- Drag Handle Area (Visual only for web, but good for mobile feel) -->
<div class="w-full h-8 flex items-center justify-center pt-2 pb-2 rounded-t-[24px]">
<div class="w-8 h-1 bg-outline-variant rounded-full"></div>
</div>
<!-- Sheet Header -->
<div class="px-container-padding pb-stack-gap flex items-center justify-between">
<h2 class="font-headline-md text-headline-md text-on-surface" id="sheet-title">Return to Sales</h2>
<button class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-surface-container-high transition-colors text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="close">close</span>
</button>
</div>
<!-- Sheet Content -->
<div class="px-container-padding pb-section-margin flex-1 overflow-y-auto">
<form class="flex flex-col gap-stack-gap">
<div class="flex flex-col gap-1">
<label class="font-subheading text-subheading text-on-surface" for="return-reason">Reason for Return</label>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-2">Please provide specific details to help the sales rep adjust the quote.</p>
<textarea class="w-full bg-surface border border-outline-variant rounded-lg p-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow resize-none" id="return-reason" name="return-reason" placeholder="Discount too high for teak wardrobe — keep under 8%." required="" rows="4">Discount too high for teak wardrobe — keep under 8%.</textarea>
</div>
</form>
</div>
<!-- Sheet Footer (Sticky to bottom) -->
<div class="p-container-padding bg-surface-container-lowest border-t border-outline-variant/30 flex gap-inline-gap mt-auto pb-safe">
<button class="flex-1 h-[44px] flex items-center justify-center rounded-DEFAULT border border-outline bg-surface-container-lowest text-on-surface font-subheading text-subheading hover:bg-surface-container-low transition-colors active:scale-[0.98]" type="button">
                Cancel
            </button>
<button class="flex-1 h-[44px] flex items-center justify-center rounded-DEFAULT bg-error text-on-error font-subheading text-subheading hover:bg-error/90 transition-colors active:scale-[0.98]" type="button">
                Return quote
            </button>
</div>
</div>
</body></html>
