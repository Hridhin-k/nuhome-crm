<div class="flex items-center justify-between h-11 w-full max-w-7xl mx-auto">

<div class="flex flex-col">
<h1 class="font-headline-md text-headline-md font-bold text-on-primary tracking-tight truncate">Customer walk-in</h1>
</div>
</div>
<button aria-label="Profile" class="w-10 h-10 flex items-center justify-center rounded-full overflow-hidden border border-on-primary/20 hover:bg-primary-container/20 transition-opacity duration-200 active:opacity-80">

<p class="font-body-sm text-body-sm text-on-primary/80">Profile, materials, then save a draft or submit to Accounts.</p>
</div>
</header>

<div class="w-full bg-surface-container-high rounded-lg p-1 flex items-center relative overflow-hidden">

<button class="flex-1 py-2 relative z-10 font-subheading text-subheading text-primary text-center">
                Customer
            </button>
<button class="flex-1 py-2 relative z-10 font-subheading text-subheading text-outline text-center hover:text-on-surface transition-colors">
                Materials
            </button>
<button class="flex-1 py-2 relative z-10 font-subheading text-subheading text-outline text-center hover:text-on-surface transition-colors">
                Review
            </button>
</div>
<!-- Main Card -->
<div class="bg-surface-container-lowest rounded-[10px] border border-surface-variant p-container-padding flex flex-col gap-stack-gap shadow-sm">
<div class="flex flex-col gap-1 mb-2">
<h2 class="font-headline-md text-headline-md text-on-surface">Customer Details</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Select an existing customer or create a new one.</p>
</div>
<!-- Search / Selection Input -->
<div class="relative w-full">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-1 ml-1 uppercase tracking-wider">Select Customer</label>
<div class="relative flex items-center w-full h-[44px] bg-surface rounded-lg border border-outline-variant focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
<span class="material-symbols-outlined absolute left-3 text-outline pointer-events-none" data-icon="search">search</span>
<input class="w-full h-full pl-10 pr-10 bg-transparent border-none text-on-surface font-body-md focus:ring-0 rounded-lg placeholder-outline" placeholder="Search customers..." readonly="" type="text" value="Ananya Nair"/>
<button class="absolute right-3 w-6 h-6 flex items-center justify-center rounded-full bg-surface-container-high text-on-surface-variant hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="close">close</span>
</button>
</div>
</div>

<span class="font-body-sm text-body-sm text-on-surface-variant truncate">Premium Account • ID: C-88921</span>
</div>
<button class="text-primary hover:bg-surface-variant p-2 rounded-full transition-colors flex shrink-0">

<span class="material-symbols-outlined text-[20px]" data-icon="add">add</span>

</div>

<span class="font-label-caps text-[10px] leading-none uppercase tracking-wider">Home</span>

<button class="flex flex-col items-center justify-center w-16 h-full text-primary font-bold hover:bg-surface-container-low scale-95 active:scale-90 transition-transform duration-150 relative group">

<span class="font-label-caps text-[10px] leading-none uppercase tracking-wider">Customers</span>
<div class="absolute -top-1 left-1/2 -translate-x-1/2 w-8 h-1 bg-primary rounded-b-full"></div>

<button class="flex flex-col items-center justify-center w-16 h-full text-secondary hover:bg-surface-container-low scale-95 active:scale-90 transition-transform duration-150 relative group">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="description">description</span>
<span class="font-label-caps text-[10px] leading-none uppercase tracking-wider">Quotes</span>

<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="shopping_cart">shopping_cart</span>
<span class="font-label-caps text-[10px] leading-none uppercase tracking-wider">Orders</span>
</button>
<button class="flex flex-col items-center justify-center w-16 h-full text-secondary hover:bg-surface-container-low scale-95 active:scale-90 transition-transform duration-150 relative group">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="more_horiz">more_horiz</span>
<span class="font-label-caps text-[10px] leading-none uppercase tracking-wider">More</span>
