</div>

<!-- Decorative subtle background -->

<h3 class="font-subheading text-subheading text-on-background mb-4 border-b border-outline-variant pb-2">Record Receipt</h3>
<!-- Item List for Receiving -->
<div class="flex flex-col gap-stack-gap">
<!-- Item 1 -->
<div class="flex flex-col gap-2 p-3 bg-surface rounded-lg border border-outline-variant">
<div class="flex justify-between items-start">
<div>
<p class="font-subheading text-subheading text-on-background">Teak Wood Planks 2x4</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">Expected: 150 units</p>
</div>
</div>
<div class="flex items-center justify-between mt-2 pt-2 border-t border-outline-variant border-dashed">
<span class="font-body-sm text-body-sm text-on-surface">Received Qty:</span>
<div class="flex items-center bg-surface-container rounded-md border border-outline-variant">
<button class="w-8 h-8 flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high rounded-l-md active:scale-95">

</div>
</div>
</div>

<div>

<p class="font-body-sm text-body-sm text-on-surface-variant">Expected: 50 units</p>
</div>
</div>
<div class="flex items-center justify-between mt-2 pt-2 border-t border-outline-variant border-dashed">

<div class="flex items-center bg-surface-container rounded-md border border-outline-variant">
<button class="w-8 h-8 flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high rounded-l-md active:scale-95">
<span class="material-symbols-outlined text-[18px]">remove</span>

<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-low dark:hover:bg-surface-container-high active:scale-90 transition-transform duration-200 p-2 rounded-lg">
<span class="material-symbols-outlined">inventory_2</span>

<button class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed font-bold hover:bg-surface-container-low dark:hover:bg-surface-container-high active:scale-90 transition-transform duration-200 p-2 rounded-lg">

</button>

<span class="material-symbols-outlined">more_horiz</span>
<span class="font-label-caps text-label-caps mt-1">More</span>
</button>
</div>

<script>
        // Simple script to handle segmented control and chips toggle for demonstration
        document.querySelectorAll('.rounded-full.border').forEach(button => {
            button.addEventListener('click', function() {
                if(this.parentElement.querySelector('.bg-primary')) {
                    this.parentElement.querySelectorAll('button').forEach(btn => {
                        btn.classList.remove('bg-primary', 'text-on-primary', 'border-primary');
                        btn.classList.add('bg-surface', 'text-on-surface', 'border-outline-variant');
                        if(btn.querySelector('.material-symbols-outlined')) {
                            btn.querySelector('.material-symbols-outlined').remove();
                        }
                    });
                }
                
                this.classList.remove('bg-surface', 'text-on-surface', 'border-outline-variant');
                this.classList.add('bg-primary', 'text-on-primary', 'border-primary');
                
                if(!this.querySelector('.material-symbols-outlined')) {
                    const icon = document.createElement('span');
                    icon.className = 'material-symbols-outlined text-[14px]';
                    // Determine icon based on text
                    if(this.innerText.includes('Shortage')) icon.innerText = 'remove_shopping_cart';
                    else if(this.innerText.includes('Damage')) icon.innerText = 'broken_image';
                    else if(this.innerText.includes('Return')) icon.innerText = 'keyboard_return';
                    else icon.innerText = 'cancel';
                    
                    this.prepend(icon);
                }
            });
        });
    </script>
