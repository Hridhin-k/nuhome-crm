<!DOCTYPE html>

                    "surface-container-high": "#e8e8e8",
                    "tertiary-container": "#1b1b1b",
                    "on-secondary-container": "#54647a",
                    "on-tertiary-fixed-variant": "#474747",
                    "on-error": "#ffffff",
                    "primary-fixed": "#e2e2e2",
                    "error": "#ba1a1a",

            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "unit": "4px",
                    "container-padding": "16px",
                    "stack-gap": "12px",
                    "section-margin": "24px",
                    "inline-gap": "8px"
            },
            "fontFamily": {
                    "data-tabular": ["Inter"],
                    "label-caps": ["Inter"],
                    "body-sm": ["Inter"],
                    "headline-md": ["Inter"],
                    "body-md": ["Inter"],
                    "subheading": ["Inter"],
                    "headline-lg": ["Inter"]
            },
            "fontSize": {
                    "data-tabular": ["13px", {"lineHeight": "18px", "fontWeight": "500"}],

<style type="text/tailwindcss">
      @layer utilities {
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
      }

<body class="bg-background text-on-background font-sans min-h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="bg-primary text-on-primary flex justify-between items-center w-full px-container-padding h-11 docked full-width top-0 transition-opacity duration-200 active:opacity-80 z-40 sticky shadow-sm">
<button aria-label="Menu" class="flex items-center justify-center hover:bg-primary-container/20 rounded-full p-1">
<span class="material-symbols-outlined text-on-primary" style="font-variation-settings: 'FILL' 1;">menu</span>
</button>
<span class="font-headline-md text-headline-md font-bold text-on-primary tracking-tight">Nuhome Sales</span>
<div class="w-8 h-8 rounded-full overflow-hidden border border-surface/20 flex-shrink-0 cursor-pointer">
<img alt="sales_representative_avatar" class="w-full h-full object-cover" data-alt="A professional headshot of a corporate sales representative, male, 30s, smiling softly. He is wearing a crisp white collared shirt. The background is a very softly blurred modern office interior with light neutral tones and high-key lighting, matching a clean corporate aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD3dZicHKmCMg-1zWRYoFdrj0RQs-jqDqMeHTs-m6qaF3YIfZmTGgVYpcJrppp04jnpKjb4_H4bKiFVRsPNBDl_8SBqP8ubg1VjCyPZ_kb-I0FsUapwiqA5avJaw-Xc7eLQTRjAMfuvmEbfTaauLV-RxcgjOxkubHOCsL8O_CBzJ93hRqsKXo4UARK5nwEPJZCJXWj54M3-cTDYSA40uC-S51f8n7VtOaHxIPUqWkV8TCVwztsDsaGzIQ"/>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 px-container-padding py-section-margin flex flex-col gap-stack-gap pb-[88px]">
<!-- Screen Header -->
<div class="flex flex-col gap-1 mb-2">
<h1 class="font-headline-lg text-headline-lg text-on-surface">Approvals</h1>
<p class="font-body-sm text-body-sm text-secondary">Selling price, discount, and margin.</p>
</div>
<!-- Approvals List -->
<div class="flex flex-col gap-stack-gap">
<!-- Item 1: Normal/Neutral Margin -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-container-padding flex flex-col gap-inline-gap hover:bg-surface-container-low transition-colors duration-150 cursor-pointer">
<div class="flex justify-between items-start w-full">
<span class="font-label-caps text-label-caps text-on-surface-variant">NQ-1042</span>
<span class="font-body-sm text-body-sm text-secondary">12 min ago</span>
</div>
<div class="flex justify-between items-center w-full">
<h2 class="font-subheading text-subheading text-on-surface truncate pr-4">Ananya Nair</h2>
<span class="font-data-tabular text-data-tabular text-primary">₹1,05,000</span>
</div>
<div class="flex items-center justify-between w-full pt-1">
<div class="flex items-center gap-1.5 px-2 py-0.5 bg-surface-container-high rounded-full border border-surface-dim">
<span class="material-symbols-outlined text-[14px] text-on-surface-variant">trending_up</span>
<span class="font-label-caps text-[10px] text-on-surface-variant uppercase tracking-wider">Margin 28%</span>
</div>
<div class="flex items-center gap-1.5 text-secondary">
<span class="material-symbols-outlined text-[16px]">person</span>
<span class="font-body-sm text-[13px]">Priya</span>
</div>
</div>
</div>
<!-- Item 2: Warning Margin -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-container-padding flex flex-col gap-inline-gap hover:bg-surface-container-low transition-colors duration-150 cursor-pointer">
<div class="flex justify-between items-start w-full">
<span class="font-label-caps text-label-caps text-on-surface-variant">NQ-1039</span>
<!-- No time provided in prompt for this item, omitting to keep it clean, or could assume just now -->
</div>
<div class="flex justify-between items-center w-full">
<h2 class="font-subheading text-subheading text-on-surface truncate pr-4">Suresh Menon</h2>
<span class="font-data-tabular text-data-tabular text-primary">₹2,40,000</span>
</div>
<div class="flex items-center justify-between w-full pt-1">
<!-- Warning Pill using Error tokens as per config availability for stark contrast -->
<div class="flex items-center gap-1.5 px-2 py-0.5 bg-error-container rounded-full border border-error/20">
<span class="material-symbols-outlined text-[14px] text-on-error-container" style="font-variation-settings: 'FILL' 1;">warning</span>
<span class="font-label-caps text-[10px] text-on-error-container uppercase tracking-wider">Margin 11%</span>
</div>
<div class="flex items-center gap-1.5 text-secondary">
<!-- Requester omitted in prompt for item 2, could add a placeholder or leave blank. Leaving blank for asymmetrical realism. -->
<button class="font-subheading text-[13px] text-primary underline underline-offset-2">Review</button>
</div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center bg-surface px-unit pb-safe h-[64px] border-t border-outline-variant">
<!-- Inactive -->
<a class="flex flex-col items-center justify-center text-secondary w-full h-full hover:bg-surface-container-low transition-colors duration-150" href="#">
<span class="material-symbols-outlined mb-1 text-[24px]">home</span>
<span class="font-label-caps text-[10px]">Home</span>
</a>
<!-- Inactive -->
<a class="flex flex-col items-center justify-center text-secondary w-full h-full hover:bg-surface-container-low transition-colors duration-150" href="#">
<span class="material-symbols-outlined mb-1 text-[24px]">group</span>
<span class="font-label-caps text-[10px]">Customers</span>
</a>
<!-- Active Nav (Semantic Mapping: Approvals -> Quotes) -->
<a class="flex flex-col items-center justify-center text-primary font-bold w-full h-full scale-95 active:scale-90 transition-transform duration-150" href="#">
<div class="relative">
<span class="material-symbols-outlined mb-1 text-[24px]" style="font-variation-settings: 'FILL' 1;">description</span>
<!-- Optional dot indicator for pending approvals -->
<span class="absolute top-0 right-0 w-2 h-2 bg-error rounded-full border border-surface"></span>
</div>
<span class="font-label-caps text-[10px]">Quotes</span>
</a>
<!-- Inactive -->
<a class="flex flex-col items-center justify-center text-secondary w-full h-full hover:bg-surface-container-low transition-colors duration-150" href="#">
<span class="material-symbols-outlined mb-1 text-[24px]">shopping_cart</span>
<span class="font-label-caps text-[10px]">Orders</span>
</a>
<!-- Inactive -->
<a class="flex flex-col items-center justify-center text-secondary w-full h-full hover:bg-surface-container-low transition-colors duration-150" href="#">
<span class="material-symbols-outlined mb-1 text-[24px]">more_horiz</span>
<span class="font-label-caps text-[10px]">More</span>
</a>
</nav>
</body></html>
