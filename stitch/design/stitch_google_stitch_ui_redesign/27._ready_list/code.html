<h1 class="font-headline-lg text-headline-lg text-on-primary dark:text-on-primary-container tracking-tight">Ready</h1>

</div>

<div class="flex justify-between items-end mb-4">
<h2 class="font-headline-md text-headline-md">Handover Ready</h2>
<span class="font-label-caps text-label-caps text-on-surface-variant bg-surface-container px-2 py-1 rounded-full">1 Order</span>
</div>
<!-- Ready Order Card -->
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant p-4 space-y-3 relative overflow-hidden group hover:shadow-md transition-shadow">
<div class="absolute top-0 left-0 w-1 h-full bg-[#10b981]"></div>
<div class="flex justify-between items-start">
<div>
<div class="flex items-center gap-2 mb-1">
<span class="font-data-tabular text-data-tabular text-on-surface-variant">NQ-1042</span>

</div>

</div>
</div>

<span class="material-symbols-outlined text-on-surface-variant" data-icon="info">info</span>
<p class="font-body-sm text-body-sm text-on-surface-variant">Complete handover with the customer.</p>
</div>
<div class="pt-2 flex justify-end gap-inline-gap">
<button class="h-11 px-4 font-subheading text-subheading border border-primary text-primary rounded bg-surface-container-lowest hover:bg-surface-container-low transition-colors">

<button class="h-11 px-4 font-subheading text-subheading bg-primary text-on-primary rounded hover:opacity-90 transition-opacity flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="check_circle">check_circle</span>

                </button>
</div>
</div>
