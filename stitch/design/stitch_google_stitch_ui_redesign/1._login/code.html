<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nuhome - Sign In</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#ffffff",
                        "on-secondary-container": "#54647a",
                        "surface-tint": "#5e5e5e",
                        "secondary-fixed": "#d3e4fe",
                        "on-surface-variant": "#4c4546",
                        "surface-dim": "#dadada",
                        "on-secondary-fixed-variant": "#38485d",
                        "tertiary": "#000000",
                        "tertiary-container": "#1b1b1b",
                        "background": "#f9f9f9",
                        "on-primary-fixed": "#1b1b1b",
                        "on-surface": "#1b1b1b",
                        "secondary-fixed-dim": "#b7c8e1",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#c6c6c6",
                        "on-error": "#ffffff",
                        "on-primary-container": "#848484",
                        "tertiary-fixed": "#e2e2e2",
                        "surface": "#f9f9f9",
                        "on-primary": "#ffffff",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#303030",
                        "surface-bright": "#f9f9f9",
                        "error": "#ba1a1a",
                        "outline": "#7e7576",
                        "error-container": "#ffdad6",
                        "surface-container-highest": "#e2e2e2",
                        "secondary": "#505f76",
                        "surface-container-low": "#f3f3f3",
                        "on-primary-fixed-variant": "#474747",
                        "on-tertiary-container": "#848484",
                        "primary-container": "#1b1b1b",
                        "on-secondary-fixed": "#0b1c30",
                        "secondary-container": "#d0e1fb",
                        "primary-fixed": "#e2e2e2",
                        "surface-container-high": "#e8e8e8",
                        "primary-fixed-dim": "#c6c6c6",
                        "on-tertiary-fixed": "#1b1b1b",
                        "on-background": "#1b1b1b",
                        "surface-variant": "#e2e2e2",
                        "surface-container": "#eeeeee",
                        "primary": "#000000",
                        "on-tertiary-fixed-variant": "#474747",
                        "on-tertiary": "#ffffff",
                        "inverse-primary": "#c6c6c6",
                        "outline-variant": "#cfc4c5",
                        "inverse-on-surface": "#f1f1f1"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "inline-gap": "8px",
                        "stack-gap": "12px",
                        "unit": "4px",
                        "container-padding": "16px",
                        "section-margin": "24px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "data-tabular": ["Inter"],
                        "body-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "subheading": ["Inter"],
                        "label-caps": ["Inter"],
                        "headline-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "data-tabular": ["13px", { "lineHeight": "18px", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "subheading": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Custom form overrides for tight aesthetics */
        [type='email'], [type='password'] {
            box-shadow: none !important;
        }
    </style>
</head>
<body class="bg-primary min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-fixed selection:text-primary">
<!-- Top Wordmark -->
<header class="w-full pt-6 pb-2 flex justify-center items-center px-container-padding">
<span class="font-data-tabular text-data-tabular text-on-primary opacity-80 uppercase tracking-widest">Nuhome</span>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col justify-center px-container-padding pb-section-margin w-full max-w-md mx-auto relative z-10">
<!-- Hero Section -->
<div class="flex flex-col gap-stack-gap mb-10">
<h1 class="font-headline-md text-headline-md text-on-primary">Sign in</h1>
<p class="font-body-md text-body-md text-on-primary opacity-80 max-w-[280px]">
                Quotes, payments, and fulfillment — on your phone first.
            </p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant p-container-padding flex flex-col gap-stack-gap relative z-20">
<form class="flex flex-col gap-stack-gap">
<!-- Email Field -->
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-unit ml-1" for="email">Email</label>
<input class="h-[44px] w-full rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface px-3 font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email" placeholder="name@company.com" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col">
<div class="flex justify-between items-end mb-unit ml-1">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="password">Password</label>
</div>
<input class="h-[44px] w-full rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface px-3 font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Submit Button -->
<button class="h-[44px] mt-2 w-full bg-primary text-on-primary rounded-lg flex items-center justify-center font-subheading text-subheading hover:bg-on-surface-variant active:scale-[0.98] transition-all duration-150" type="submit">
                    Sign in
                </button>
</form>
</div>
</main>
</body></html>
