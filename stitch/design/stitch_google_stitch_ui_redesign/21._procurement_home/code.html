<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Procurement Home</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#1b1b1b",
                        "outline": "#7e7576",
                        "tertiary-fixed-dim": "#c6c6c6",
                        "inverse-on-surface": "#f1f1f1",
                        "tertiary": "#000000",
                        "surface-container-highest": "#e2e2e2",
                        "primary-fixed": "#e2e2e2",
                        "secondary-fixed-dim": "#b7c8e1",
                        "surface-tint": "#5e5e5e",
                        "on-primary-fixed": "#1b1b1b",
                        "surface-dim": "#dadada",
                        "on-secondary-container": "#54647a",
                        "on-tertiary-fixed-variant": "#474747",
                        "outline-variant": "#cfc4c5",
                        "primary": "#000000",
                        "on-surface": "#1b1b1b",
                        "on-tertiary-container": "#848484",
                        "on-surface-variant": "#4c4546",
                        "inverse-primary": "#c6c6c6",
                        "surface": "#f9f9f9",
                        "on-tertiary-fixed": "#1b1b1b",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed-variant": "#38485d",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#474747",
                        "on-error": "#ffffff",
                        "background": "#f9f9f9",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "secondary": "#505f76",
                        "surface-bright": "#f9f9f9",
                        "surface-container-high": "#e8e8e8",
                        "on-secondary-fixed": "#0b1c30",
                        "on-error-container": "#93000a",
                        "tertiary-fixed": "#e2e2e2",
                        "secondary-fixed": "#d3e4fe",
                        "surface-variant": "#e2e2e2",
                        "tertiary-container": "#1b1b1b",
                        "on-background": "#1b1b1b",
                        "on-primary-container": "#848484",
                        "error-container": "#ffdad6",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#303030",
                        "primary-fixed-dim": "#c6c6c6",
                        "secondary-container": "#d0e1fb",
                        "surface-container": "#eeeeee",
                        "surface-container-low": "#f3f3f3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "container-padding": "16px",
                        "section-margin": "24px",
                        "stack-gap": "12px",
                        "inline-gap": "8px"
                    },
                    "fontFamily": {
                        "data-tabular": ["Inter"],
                        "body-md": ["Inter"],
                        "subheading": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "data-tabular": ["13px", { "lineHeight": "18px", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "subheading": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface h-full flex flex-col font-body-md">
<!-- TopAppBar -->
<header class="bg-primary dark:bg-primary-container text-on-primary dark:text-on-primary-container fixed top-0 w-full z-50 border-b border-outline-variant flat no shadows flex justify-between items-center h-14 px-container-padding w-full">
<button class="hover:opacity-80 transition-opacity active:scale-95 transition-transform flex items-center justify-center p-2 -ml-2 text-on-primary-fixed-variant">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<div class="font-headline-lg text-headline-lg text-on-primary dark:text-on-primary-container tracking-tight">Nuhome</div>
<button class="hover:opacity-80 transition-opacity active:scale-95 transition-transform flex items-center justify-center p-2 -mr-2 text-on-primary-fixed-variant">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 pt-14 pb-24 overflow-y-auto">
<!-- Header Section -->
<div class="px-container-padding py-section-margin bg-surface-container-lowest border-b border-outline-variant">
<h1 class="font-headline-md text-headline-md mb-1">Hi Arjun,</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Procurement · 5 waiting</p>
</div>
<!-- Inbox Categories (Bento Grid Style) -->
<div class="p-container-padding grid grid-cols-1 md:grid-cols-2 gap-stack-gap">
<!-- Category Card 1 -->
<button class="bg-surface-container-lowest border border-outline-variant rounded-lg p-container-padding flex items-center justify-between hover:bg-surface-container-low active:bg-surface-container transition-colors text-left w-full group">
<div class="flex items-center gap-inline-gap">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface">
<span class="material-symbols-outlined" data-icon="schedule">schedule</span>
</div>
<div>
<h2 class="font-subheading text-subheading text-on-surface group-hover:text-primary transition-colors">Awaiting vendor action</h2>
</div>
</div>
<div class="flex items-center gap-inline-gap">
<span class="font-data-tabular text-data-tabular bg-primary text-on-primary px-2 py-0.5 rounded-full">2</span>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</div>
</button>
<!-- Category Card 2 -->
<button class="bg-surface-container-lowest border border-outline-variant rounded-lg p-container-padding flex items-center justify-between hover:bg-surface-container-low active:bg-surface-container transition-colors text-left w-full group">
<div class="flex items-center gap-inline-gap">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface">
<span class="material-symbols-outlined" data-icon="local_shipping">local_shipping</span>
</div>
<div>
<h2 class="font-subheading text-subheading text-on-surface group-hover:text-primary transition-colors">Vendor dispatches</h2>
</div>
</div>
<div class="flex items-center gap-inline-gap">
<span class="font-data-tabular text-data-tabular bg-surface-container-highest text-on-surface px-2 py-0.5 rounded-full">1</span>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</div>
</button>
<!-- Category Card 3 -->
<button class="bg-surface-container-lowest border border-outline-variant rounded-lg p-container-padding flex items-center justify-between hover:bg-surface-container-low active:bg-surface-container transition-colors text-left w-full group">
<div class="flex items-center gap-inline-gap">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface">
<span class="material-symbols-outlined" data-icon="inventory_2">inventory_2</span>
</div>
<div>
<h2 class="font-subheading text-subheading text-on-surface group-hover:text-primary transition-colors">Items expected</h2>
</div>
</div>
<div class="flex items-center gap-inline-gap">
<span class="font-data-tabular text-data-tabular bg-surface-container-highest text-on-surface px-2 py-0.5 rounded-full">1</span>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</div>
</button>
<!-- Category Card 4 -->
<button class="bg-surface-container-lowest border border-outline-variant rounded-lg p-container-padding flex items-center justify-between hover:bg-surface-container-low active:bg-surface-container transition-colors text-left w-full group">
<div class="flex items-center gap-inline-gap">
<div class="w-10 h-10 rounded-full bg-error-container flex items-center justify-center text-on-error-container">
<span class="material-symbols-outlined" data-icon="warning">warning</span>
</div>
<div>
<h2 class="font-subheading text-subheading text-on-surface group-hover:text-primary transition-colors">Vendor overdue</h2>
</div>
</div>
<div class="flex items-center gap-inline-gap">
<span class="font-data-tabular text-data-tabular bg-error text-on-error px-2 py-0.5 rounded-full">1</span>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</div>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="bg-surface dark:bg-surface-container fixed bottom-0 w-full z-50 h-16 border-t border-outline-variant bg-surface dark:bg-surface-container flat no shadows fixed bottom-0 left-0 w-full flex justify-around items-center px-container-padding pb-safe md:hidden">
<button class="hover:bg-surface-container-low dark:hover:bg-surface-container-high active:scale-90 transition-transform duration-200 flex flex-col items-center justify-center text-primary dark:text-primary-fixed font-bold w-16 h-full">
<span class="material-symbols-outlined" data-icon="home" data-weight="fill">home</span>
<span class="font-label-caps text-label-caps mt-1">Home</span>
</button>
<button class="hover:bg-surface-container-low dark:hover:bg-surface-container-high active:scale-90 transition-transform duration-200 flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim w-16 h-full">
<span class="material-symbols-outlined" data-icon="shopping_cart">shopping_cart</span>
<span class="font-label-caps text-label-caps mt-1">Orders</span>
</button>
<button class="hover:bg-surface-container-low dark:hover:bg-surface-container-high active:scale-90 transition-transform duration-200 flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim w-16 h-full">
<span class="material-symbols-outlined" data-icon="inventory_2">inventory_2</span>
<span class="font-label-caps text-label-caps mt-1">Vendors</span>
</button>
<button class="hover:bg-surface-container-low dark:hover:bg-surface-container-high active:scale-90 transition-transform duration-200 flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim w-16 h-full">
<span class="material-symbols-outlined" data-icon="local_shipping">local_shipping</span>
<span class="font-label-caps text-label-caps mt-1">Fulfillment</span>
</button>
<button class="hover:bg-surface-container-low dark:hover:bg-surface-container-high active:scale-90 transition-transform duration-200 flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim w-16 h-full">
<span class="material-symbols-outlined" data-icon="more_horiz">more_horiz</span>
<span class="font-label-caps text-label-caps mt-1">More</span>
</button>
</nav>
</body></html>
