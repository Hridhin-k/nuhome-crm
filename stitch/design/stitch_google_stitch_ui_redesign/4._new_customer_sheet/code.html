<body class="bg-background text-on-background font-body-md h-full overflow-hidden flex flex-col relative">

<div class="space-y-stack-gap">

<div class="bg-surface-container-lowest p-container-padding rounded-lg border border-surface-variant flex justify-between items-center">

</div>

<!-- Sheet Header -->

<div class="flex justify-between items-center mb-1">
<h2 class="font-headline-lg text-headline-lg text-on-surface">New customer</h2>
<button class="p-2 -mr-2 text-on-surface-variant hover:bg-surface-container-low rounded-full transition-colors" id="closeBtn">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant">Name and phone are enough on the floor. Phone must be unique.</p>
</div>
<!-- Form Content -->
<div class="px-container-padding py-section-margin overflow-y-auto flex-1 space-y-stack-gap">
<!-- Name Field -->
<div class="flex flex-col">
<label class="font-subheading text-subheading text-on-surface mb-1" for="name">Name <span class="text-error">*</span></label>
<input class="h-[44px] px-3 border border-outline-variant rounded-lg bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary text-body-md transition-shadow" id="name" placeholder="e.g. Alex Johnson" type="text"/>
</div>
<!-- Phone Field -->
<div class="flex flex-col">
<label class="font-subheading text-subheading text-on-surface mb-1" for="phone">Phone <span class="text-error">*</span></label>
<input class="h-[44px] px-3 border border-outline-variant rounded-lg bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary text-body-md transition-shadow" id="phone" placeholder="(555) 000-0000" type="tel"/>
</div>
<!-- Email Field -->
<div class="flex flex-col">
<label class="font-subheading text-subheading text-on-surface mb-1" for="email">Email <span class="text-on-surface-variant font-normal text-sm">(optional)</span></label>
<input class="h-[44px] px-3 border border-outline-variant rounded-lg bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary text-body-md transition-shadow" id="email" placeholder="alex@example.com" type="email"/>
</div>
<!-- Address Field -->
<div class="flex flex-col">
<label class="font-subheading text-subheading text-on-surface mb-1" for="address">Address <span class="text-on-surface-variant font-normal text-sm">(optional)</span></label>
<textarea class="p-3 border border-outline-variant rounded-lg bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary text-body-md transition-shadow resize-none" id="address" placeholder="123 Main St, City, ST 12345" rows="3"></textarea>
</div>
<!-- Notes Field -->
<div class="flex flex-col">
<label class="font-subheading text-subheading text-on-surface mb-1" for="notes">Notes <span class="text-on-surface-variant font-normal text-sm">(optional)</span></label>
<textarea class="p-3 border border-outline-variant rounded-lg bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary text-body-md transition-shadow resize-none" id="notes" placeholder="Any specific requirements..." rows="2"></textarea>
</div>
</div>
<!-- Footer Actions -->
<div class="px-container-padding py-stack-gap border-t border-surface-variant bg-surface-container-lowest flex gap-inline-gap pb-safe mt-auto">
<button class="flex-1 h-[44px] border border-primary text-primary font-subheading text-subheading rounded-lg hover:bg-surface-container-low transition-colors flex items-center justify-center" id="cancelBtn">
                Cancel
            </button>
<button class="flex-1 h-[44px] bg-primary text-on-primary font-subheading text-subheading rounded-lg hover:bg-primary/90 transition-colors shadow-sm flex items-center justify-center">
                Save
            </button>
</div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const bottomSheet = document.getElementById('bottomSheet');
            const scrim = document.getElementById('scrim');
            const closeBtn = document.getElementById('closeBtn');
            const cancelBtn = document.getElementById('cancelBtn');

            // Auto-open for demonstration
            setTimeout(() => {
                bottomSheet.classList.add('open');
                scrim.classList.add('open');
            }, 100);

            const closeSheet = () => {
                bottomSheet.classList.remove('open');
                scrim.classList.remove('open');
            };

            closeBtn.addEventListener('click', closeSheet);
            cancelBtn.addEventListener('click', closeSheet);
            scrim.addEventListener('click', closeSheet);
        });
    </script>
