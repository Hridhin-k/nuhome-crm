<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Store Home - Faisal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#1b1b1b",
                        "outline": "#7e7576",
                        "tertiary-fixed-dim": "#c6c6c6",
                        "inverse-on-surface": "#f1f1f1",
                        "tertiary": "#000000",
                        "surface-container-highest": "#e2e2e2",
                        "primary-fixed": "#e2e2e2",
                        "secondary-fixed-dim": "#b7c8e1",
                        "surface-tint": "#5e5e5e",
                        "on-primary-fixed": "#1b1b1b",
                        "surface-dim": "#dadada",
                        "on-secondary-container": "#54647a",
                        "on-tertiary-fixed-variant": "#474747",
                        "outline-variant": "#cfc4c5",
                        "primary": "#000000",
                        "on-surface": "#1b1b1b",
                        "on-tertiary-container": "#848484",
                        "on-surface-variant": "#4c4546",
                        "inverse-primary": "#c6c6c6",
                        "surface": "#f9f9f9",
                        "on-tertiary-fixed": "#1b1b1b",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed-variant": "#38485d",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#474747",
                        "on-error": "#ffffff",
                        "background": "#f9f9f9",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "secondary": "#505f76",
                        "surface-bright": "#f9f9f9",
                        "surface-container-high": "#e8e8e8",
                        "on-secondary-fixed": "#0b1c30",
                        "on-error-container": "#93000a",
                        "tertiary-fixed": "#e2e2e2",
                        "secondary-fixed": "#d3e4fe",
                        "surface-variant": "#e2e2e2",
                        "tertiary-container": "#1b1b1b",
                        "on-background": "#1b1b1b",
                        "on-primary-container": "#848484",
                        "error-container": "#ffdad6",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#303030",
                        "primary-fixed-dim": "#c6c6c6",
                        "secondary-container": "#d0e1fb",
                        "surface-container": "#eeeeee",
                        "surface-container-low": "#f3f3f3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "container-padding": "16px",
                        "section-margin": "24px",
                        "stack-gap": "12px",
                        "inline-gap": "8px"
                    },
                    "fontFamily": {
                        "data-tabular": ["Inter"],
                        "body-md": ["Inter"],
                        "subheading": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "data-tabular": ["13px", { "lineHeight": "18px", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "subheading": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen pt-14 pb-16">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-primary text-on-primary border-b border-outline-variant flex justify-between items-center h-14 px-container-padding">
<button class="hover:opacity-80 transition-opacity active:scale-95 text-on-primary">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<div class="font-headline-md text-headline-md font-headline-lg text-headline-lg text-on-primary tracking-tight">Nuhome</div>
<button class="hover:opacity-80 transition-opacity active:scale-95 text-on-primary">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<main class="px-container-padding py-section-margin max-w-md mx-auto">
<!-- User Greeting -->
<div class="mb-section-margin">
<h1 class="font-headline-lg text-headline-lg">Faisal</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Delivery · 2 waiting</p>
</div>
<!-- Inbox Categories (Bento-ish style) -->
<div class="grid grid-cols-2 gap-stack-gap mb-section-margin">
<!-- Ready for delivery -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-container-padding flex flex-col justify-between shadow-[0px_4px_12px_rgba(0,0,0,0.02)] active:scale-95 transition-transform">
<div class="flex items-start justify-between mb-2">
<span class="material-symbols-outlined text-primary" data-icon="local_shipping" style="font-variation-settings: 'FILL' 1;">local_shipping</span>
<span class="bg-primary text-on-primary font-data-tabular text-data-tabular px-2 py-0.5 rounded-full">1</span>
</div>
<h3 class="font-subheading text-subheading">Ready for delivery</h3>
</div>
<!-- Collect at handover -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-container-padding flex flex-col justify-between shadow-[0px_4px_12px_rgba(0,0,0,0.02)] active:scale-95 transition-transform">
<div class="flex items-start justify-between mb-2">
<span class="material-symbols-outlined text-primary" data-icon="inventory_2" style="font-variation-settings: 'FILL' 1;">inventory_2</span>
<span class="bg-primary-container text-on-primary-container font-data-tabular text-data-tabular px-2 py-0.5 rounded-full">1</span>
</div>
<h3 class="font-subheading text-subheading">Collect at handover</h3>
</div>
<!-- Vendor overdue -->
<div class="col-span-2 bg-error-container border border-error/20 rounded-lg p-container-padding flex items-center justify-between shadow-[0px_4px_12px_rgba(0,0,0,0.02)] active:scale-95 transition-transform">
<div class="flex items-center gap-inline-gap">
<span class="material-symbols-outlined text-error" data-icon="warning" style="font-variation-settings: 'FILL' 1;">warning</span>
<h3 class="font-subheading text-subheading text-on-error-container">Vendor overdue</h3>
</div>
<span class="bg-error text-on-error font-data-tabular text-data-tabular px-2 py-0.5 rounded-full">1</span>
</div>
</div>
<!-- Quick Actions -->
<div class="mb-section-margin">
<h2 class="font-subheading text-subheading mb-stack-gap text-on-surface-variant uppercase tracking-wider text-[11px]">Quick Actions</h2>
<div class="space-y-stack-gap">
<button class="w-full bg-primary text-on-primary h-[44px] rounded-lg font-subheading text-subheading flex items-center justify-center gap-2 active:scale-95 transition-transform shadow-[0px_4px_12px_rgba(0,0,0,0.05)]">
<span class="material-symbols-outlined text-[18px]" data-icon="qr_code_scanner">qr_code_scanner</span>
                    Scan Package
                </button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 h-16 border-t border-outline-variant bg-surface flex justify-around items-center px-container-padding pb-safe md:hidden">
<a class="flex flex-col items-center justify-center text-primary font-bold hover:bg-surface-container-low active:scale-90 transition-transform duration-200 p-2 rounded-lg" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-caps text-label-caps">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary hover:bg-surface-container-low active:scale-90 transition-transform duration-200 p-2 rounded-lg" href="#">
<span class="material-symbols-outlined mb-1" data-icon="local_shipping">local_shipping</span>
<span class="font-label-caps text-label-caps">Ready</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary hover:bg-surface-container-low active:scale-90 transition-transform duration-200 p-2 rounded-lg" href="#">
<span class="material-symbols-outlined mb-1" data-icon="shopping_cart">shopping_cart</span>
<span class="font-label-caps text-label-caps">Orders</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary hover:bg-surface-container-low active:scale-90 transition-transform duration-200 p-2 rounded-lg" href="#">
<span class="material-symbols-outlined mb-1" data-icon="more_horiz">more_horiz</span>
<span class="font-label-caps text-label-caps">More</span>
</a>
</nav>
</body></html>
